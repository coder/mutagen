# Set the workflow name.
name: CI

# Execute the workflow on pushes to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

# Set the token permissions.
permissions:
  contents: read

# Define the workflow jobs.
jobs:
  verification:
    name: Commit Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Perform commit verification"
        run: |
          # Determine the target commit range.
          export VERIFY_COMMIT_START="${{ github.event.pull_request.base.sha }}"
          export VERIFY_COMMIT_END="${{ github.event.pull_request.head.sha }}"

          # Perform verification.
          scripts/ci/verify_commits.sh
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
      - name: "Install sha256sum"
        run: brew install coreutils
      - run: scripts/ci/setup_go.sh
      - run: scripts/ci/setup_ssh.sh
      - run: scripts/ci/setup_partitions_darwin.sh
      - run: scripts/ci/analyze.sh
      - run: scripts/ci/test.sh
      - run: scripts/ci/build.sh
      - run: scripts/ci/sha256sum.sh
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        goversion: ['1.26.11', '1.27.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.goversion }}
      - run: scripts/ci/setup_go.sh
      - run: scripts/ci/setup_ssh.sh
      - run: scripts/ci/setup_docker.sh
      - run: scripts/ci/analyze.sh
      - run: scripts/ci/test.sh
      - run: scripts/ci/test_386.sh
      - run: scripts/ci/build.sh
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
      - run: scripts/ci/setup_go.sh
        shell: bash
      - run: scripts/ci/setup_docker.sh
        shell: bash
      - name: "Prepare Windows partition script"
        run: |
          # Populate the partition setup script with the repository path since
          # diskpart doesn't support relative paths or environment variable
          # substitution. While we could hardcode a path into the script, that
          # breaks CI for mirrors that have a different repository name.
          REPONAME="$(basename "$(pwd)")"
          sed -e "s/REPONAME/D:\\\\a\\\\${REPONAME}\\\\${REPONAME}/g" \
            scripts/ci/setup_partitions_windows_template.txt \
            > setup_partitions_windows.txt
        shell: bash
      - run: diskpart /s setup_partitions_windows.txt
      - run: scripts/ci/analyze.sh
        shell: bash
      - run: scripts/ci/test.sh
        shell: bash
      - run: scripts/ci/test_386.sh
        shell: bash
      - run: scripts/ci/build.sh
        shell: bash
  required:
    name: Required checks
    runs-on: ubuntu-latest
    if: always()
    needs: [macos, linux, windows]
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: "Check the job results"
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          # Print the result of each job.
          echo "macOS: ${MACOS_RESULT}"
          echo "Linux: ${LINUX_RESULT}"
          echo "Windows: ${WINDOWS_RESULT}"

          # Fail unless every job succeeded.
          if [[ "${MACOS_RESULT}" != "success" ]] ||
            [[ "${LINUX_RESULT}" != "success" ]] ||
            [[ "${WINDOWS_RESULT}" != "success" ]]; then
            echo "Not all jobs succeeded" 1>&2
            exit 1
          fi
