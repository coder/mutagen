# Builds and publishes the artifacts that Coder Desktop consumes. Pushing a v*
# tag creates a GitHub release; running the workflow manually only uploads the
# artifacts to the workflow run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Release
    # Release builds require macOS (see scripts/build.go).
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - name: "Install sha256sum"
        run: brew install coreutils
      - run: scripts/ci/setup_go.sh
      - name: "Verify that the tag matches the Mutagen version"
        if: github.ref_type == 'tag'
        run: |
          MUTAGEN_VERSION="$(go run -tags mutagencli ./cmd/mutagen version)"
          if [[ "v${MUTAGEN_VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match Mutagen version ${MUTAGEN_VERSION}" 1>&2
            exit 1
          fi
      - run: scripts/ci/build.sh
      - run: scripts/ci/sha256sum.sh
      - run: scripts/ci/bundle_coder_desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coder-desktop
          path: build/coder-desktop/*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: build/release/*
          retention-days: 2
      - name: "Create GitHub release"
        if: github.ref_type == 'tag'
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes build/coder-desktop/*
        env:
          GH_TOKEN: ${{ github.token }}
