# Builds, signs, and publishes the artifacts that Coder Desktop consumes.
#
# Windows binaries (the CLI and the agents inside the agent bundle) are signed
# with Coder's EV certificate through Google Cloud KMS, using the same jsign
# setup as coder/coder. Pushing a v* tag creates a GitHub release; running the
# workflow manually only uploads the artifacts to the workflow run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Release
    # Release builds require macOS (see scripts/build.go).
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
      - name: "Install sha256sum"
        run: brew install coreutils
      - run: scripts/ci/setup_go.sh
      - name: "Verify that the tag matches the Mutagen version"
        if: github.ref_type == 'tag'
        run: |
          MUTAGEN_VERSION="$(go run ./cmd/mutagen version)"
          if [[ "v${MUTAGEN_VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match Mutagen version ${MUTAGEN_VERSION}" 1>&2
            exit 1
          fi
      - name: "Install jsign"
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/jsign-6.0.jar" https://github.com/ebourg/jsign/releases/download/6.0/jsign-6.0.jar
          echo "05ca18d4ab7b8c2183289b5378d32860f0ea0f3bdab1f1b8cae5894fb225fa8a  ${RUNNER_TEMP}/jsign-6.0.jar" | sha256sum -c -
      - name: "Set up Windows code signing certificate"
        run: |
          touch "${RUNNER_TEMP}/ev_cert.pem"
          chmod 600 "${RUNNER_TEMP}/ev_cert.pem"
          printf '%s\n' "${EV_SIGNING_CERT}" > "${RUNNER_TEMP}/ev_cert.pem"
        env:
          EV_SIGNING_CERT: ${{ secrets.EV_SIGNING_CERT }}
      # The access token is only valid for an hour, so authenticate right before
      # the build that uses it.
      - uses: google-github-actions/auth@v3
        id: gcloud_auth
        with:
          workload_identity_provider: ${{ vars.GCP_CODE_SIGNING_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          token_format: access_token
      - run: scripts/ci/build.sh
        env:
          WINDOWS_CODESIGN_COMMAND: ${{ github.workspace }}/scripts/ci/sign_windows.sh
          JSIGN_PATH: ${{ runner.temp }}/jsign-6.0.jar
          EV_CERTIFICATE_PATH: ${{ runner.temp }}/ev_cert.pem
          EV_KEYSTORE: ${{ secrets.EV_KEYSTORE }}
          EV_KEY: ${{ secrets.EV_KEY }}
          EV_TSA_URL: ${{ secrets.EV_TSA_URL }}
          GCLOUD_ACCESS_TOKEN: ${{ steps.gcloud_auth.outputs.access_token }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_CODESIGN_CERTIFICATE_AND_KEY: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_AND_KEY }}
          MACOS_CODESIGN_CERTIFICATE_AND_KEY_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_AND_KEY_PASSWORD }}
      - name: "Remove Windows code signing certificate"
        if: always()
        run: rm -f "${RUNNER_TEMP}/ev_cert.pem"
      - run: scripts/ci/sha256sum.sh
      - run: scripts/ci/bundle_coder_desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: coder-desktop
          path: build/coder-desktop/*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: build/release/*
          retention-days: 2
      - name: "Create GitHub release"
        if: github.ref_type == 'tag'
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes build/coder-desktop/*
        env:
          GH_TOKEN: ${{ github.token }}
