# Builds the artifacts that Coder Desktop consumes. With a tag, it also
# publishes them as a GitHub release; without one, it only uploads them to the
# workflow run.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v0.18.4); empty for a dry run'
        required: false
        type: string

jobs:
  build:
    name: Build
    # Release builds require macOS (see scripts/build.go).
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: "Validate the release tag"
        if: inputs.tag != ''
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        if: inputs.tag == ''
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.tag != ''
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: "Verify that the tag is on main"
        if: inputs.tag != ''
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag ${RELEASE_TAG} is not on main" 1>&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
      - name: "Install sha256sum"
        run: brew install coreutils
      - run: scripts/ci/setup_go.sh
      - name: "Verify that the tag matches the Mutagen version"
        if: inputs.tag != ''
        run: |
          MUTAGEN_VERSION="$(go run -tags mutagencli ./cmd/mutagen version)"
          if [[ "v${MUTAGEN_VERSION}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} doesn't match Mutagen version ${MUTAGEN_VERSION}" 1>&2
            exit 1
          fi
      - run: scripts/ci/build.sh
      - run: scripts/ci/sha256sum.sh
      - run: scripts/ci/bundle_coder_desktop.sh
      - name: "Record the digest of the coder-desktop manifest"
        id: manifest
        run: |
          MANIFEST_DIGEST="$(sha256sum build/coder-desktop/SHA256SUMS)"
          echo "sha256=${MANIFEST_DIGEST%% *}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: coder-desktop
          path: build/coder-desktop/*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: build/release/*
          retention-days: 2
  publish:
    name: Publish
    needs: build
    if: inputs.tag != ''
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coder-desktop
          path: coder-desktop
      - name: "Verify the coder-desktop artifact"
        working-directory: coder-desktop
        run: |
          sha256sum --check --strict - <<< "${MANIFEST_SHA256}  SHA256SUMS"
          sha256sum --check --strict SHA256SUMS
      - name: "Create GitHub release"
        working-directory: coder-desktop
        run: gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes SHA256SUMS mutagen-*
        env:
          GH_TOKEN: ${{ github.token }}
