name: Upload release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (e.g. v0.18.4)'
        required: true
        type: string

concurrency:
  group: upload-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Download and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=(
            mutagen-agents.tar.gz
            mutagen-darwin-amd64
            mutagen-darwin-arm64
            mutagen-windows-amd64.exe
            mutagen-windows-arm64.exe
          )
          patterns=(--pattern SHA256SUMS)
          for artifact in "${artifacts[@]}"; do
            patterns+=(--pattern "$artifact")
          done
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir artifacts "${patterns[@]}"
          cd artifacts
          sha256sum "${artifacts[@]}" | diff - SHA256SUMS
      - uses: google-github-actions/auth@v3
        id: gcloud_auth
        with:
          workload_identity_provider: ${{ vars.GCP_CODE_SIGNING_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCP_CODE_SIGNING_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Upload release assets
        shell: bash
        env:
          GCLOUD_ACCESS_TOKEN: ${{ steps.gcloud_auth.outputs.access_token }}
        run: |
          for artifact in artifacts/mutagen-* artifacts/SHA256SUMS; do
            content_md5="$(openssl dgst -md5 -binary "$artifact" | openssl base64 -A)"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GCLOUD_ACCESS_TOKEN" \
              --header "Content-Type: application/octet-stream" \
              --header "x-goog-if-generation-match: 0" \
              --header "Content-MD5: $content_md5" \
              --upload-file "$artifact" \
              "https://storage.googleapis.com/coder-desktop/mutagen/$RELEASE_TAG/${artifact##*/}"
            printf 'Uploaded gs://coder-desktop/mutagen/%s/%s\n' "$RELEASE_TAG" "${artifact##*/}"
          done
